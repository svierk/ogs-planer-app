name: Build

# Validates every change to this repository: formatting, linting, unit tests
# with coverage reporting and, finally, the Angular and Electron builds.
#
# Every `uses:` reference is pinned to an exact release tag so that an update is
# always an explicit, reviewable change - Dependabot keeps those pins current
# (see .github/dependabot.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  build:
    # Keep this job name in sync with the required status check of the `main`
    # ruleset - the check context is the job name, not the workflow name.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # disabling shallow clones improves the relevancy of the Sonar analysis
          persist-credentials: false # the GITHUB_TOKEN is not needed after the checkout - don't leave it in .git/config

      # Resolves the Node.js version from engines.node in package.json, so the
      # pipeline and the local development setup can never drift apart.
      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.1

      # `npm ci` installs exactly what package-lock.json pins and fails on a
      # drifted lock file; `--ignore-scripts` keeps install scripts of the
      # dependency tree from executing on the runner.
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check Prettier
        run: npm run prettier

      - name: Check ESLint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:ci

      # SONAR_TOKEN is the only credential this scan needs: pull request
      # decoration is handled by the SonarQube Cloud GitHub App, not by a token
      # passed in here.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Codecov Coverage Upload
        uses: codecov/codecov-action@v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Angular Build
        run: npm run build

  # Electron Forge only runs the makers that match the *host* platform, so a
  # single Linux runner can never tell us whether the Windows or macOS build
  # still works. Package on each target OS instead - this is also the only place
  # the better-sqlite3 native rebuild gets exercised per platform.
  #
  # These job names are not required status checks by default. Add them to the
  # `main` ruleset alongside `Build`, otherwise an auto-merged Dependabot PR can
  # break packaging without anything going red.
  package:
    name: Package (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Node Version
        uses: svierk/get-node-version@v1.5.1

      # Install scripts stay off for the dependency tree, but the native
      # better-sqlite3 binding still has to be built against Electron's own
      # headers - electron-forge's rebuild step does that during `make`.
      - name: Install Dependencies
        run: npm ci --ignore-scripts

      # electron-winstaller ships one 7-Zip binary per architecture and copies
      # the matching one to vendor/7z.exe in its install script - which
      # `--ignore-scripts` skips. Squirrel shells out to exactly that path when
      # it builds the release package and otherwise dies with "The system cannot
      # find the file specified". Run only this one script, so install scripts
      # stay off for the rest of the dependency tree.
      - name: Prepare Squirrel Toolchain
        if: runner.os == 'Windows'
        working-directory: node_modules/electron-winstaller
        run: node ./script/select-7z-arch.js

      - name: Electron Build
        run: npm run make
